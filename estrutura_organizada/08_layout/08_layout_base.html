<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Barber Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    {% if current_user.is_authenticated %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.dashboard') }}">Barber Manager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('main.clients') }}">Clientes</a>
                <a class="nav-link" href="{{ url_for('main.barbers') }}">Barbeiros</a>
                <a class="nav-link" href="{{ url_for('main.services') }}">Serviços</a>
                <a class="nav-link" href="{{ url_for('main.appointments') }}">Agenda</a>
                <a class="nav-link" href="{{ url_for('main.logout') }}">Sair</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>

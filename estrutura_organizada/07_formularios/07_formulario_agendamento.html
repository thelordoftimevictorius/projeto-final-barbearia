{% extends "base.html" %}

{% block title %}Editar agendamento | Barber Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">Editar agendamento</h1>
                    <a href="{{ url_for('main.appointments') }}" class="btn btn-outline-dark">Voltar</a>
                </div>

                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="client_id">Cliente</label>
                            <select id="client_id" name="client_id" class="form-select" required>
                                {% for client in clients %}
                                <option value="{{ client.id }}" {% if client.id == appointment.client_id %}selected{% endif %}>{{ client.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="barber_id">Barbeiro</label>
                            <select id="barber_id" name="barber_id" class="form-select" required>
                                {% for barber in barbers %}
                                <option value="{{ barber.id }}" {% if barber.id == appointment.barber_id %}selected{% endif %}>{{ barber.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="service_id">Serviço</label>
                            <select id="service_id" name="service_id" class="form-select" required>
                                {% for service in services %}
                                <option value="{{ service.id }}" {% if service.id == appointment.service_id %}selected{% endif %}>{{ service.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="status">Status</label>
                            <select id="status" name="status" class="form-select">
                                {% for status in statuses %}
                                <option value="{{ status }}" {% if status == appointment.status %}selected{% endif %}>{{ status }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="starts_at">Início</label>
                            <input id="starts_at" name="starts_at" type="datetime-local" class="form-control" value="{{ appointment.starts_at.replace(' ', 'T') }}" required>
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a href="{{ url_for('main.appointments') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-dark">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

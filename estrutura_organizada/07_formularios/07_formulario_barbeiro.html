{% extends "base.html" %}

{% block title %}{% if barber %}Editar barbeiro{% else %}Novo barbeiro{% endif %} | Barber Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">{% if barber %}Editar barbeiro{% else %}Novo barbeiro{% endif %}</h1>
                    <a href="{{ url_for('main.barbers') }}" class="btn btn-outline-dark">Voltar</a>
                </div>

                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="full_name">Nome completo</label>
                            <input id="full_name" name="full_name" class="form-control" value="{{ barber.full_name if barber else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phone">Telefone</label>
                            <input id="phone" name="phone" class="form-control" value="{{ barber.phone if barber else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="specialty">Especialidade</label>
                            <input id="specialty" name="specialty" class="form-control" value="{{ barber.specialty if barber else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="status">Status</label>
                            <select id="status" name="status" class="form-select">
                                <option value="active" {% if barber and barber.status == 'active' %}selected{% endif %}>Ativo</option>
                                <option value="inactive" {% if barber and barber.status == 'inactive' %}selected{% endif %}>Inativo</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a href="{{ url_for('main.barbers') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-dark">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

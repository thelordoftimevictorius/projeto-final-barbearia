{% extends "base.html" %}

{% block title %}{% if client %}Editar cliente{% else %}Novo cliente{% endif %} | Barber Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0 form-card">
            <div class="card-body p-4 p-md-5">
                <div class="form-section-title">
                    <h1 class="h3 mb-0">{% if client %}Editar cliente{% else %}Novo cliente{% endif %}</h1>
                    <a href="{{ url_for('main.clients') }}" class="btn btn-outline-dark">Voltar</a>
                </div>

                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="full_name">Nome completo</label>
                            <input id="full_name" name="full_name" class="form-control" value="{{ client.full_name if client else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phone">Telefone</label>
                            <input id="phone" name="phone" class="form-control" value="{{ client.phone if client else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">E-mail</label>
                            <input id="email" name="email" type="email" class="form-control" value="{{ client.email if client else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="birth_date">Data de nascimento</label>
                            <input id="birth_date" name="birth_date" type="date" class="form-control" value="{{ client.birth_date if client else '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="profile_photo_url">URL da foto de perfil</label>
                            <input id="profile_photo_url" name="profile_photo_url" class="form-control" value="{{ client.profile_photo_url if client else '' }}" placeholder="https://...">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="notes">Observações</label>
                            <textarea id="notes" name="notes" class="form-control" rows="4">{{ client.notes if client else '' }}</textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="{{ url_for('main.clients') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-dark">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
